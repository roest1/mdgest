[package]
name = "mdgest-desktop"
version = "0.2.0"
description = "pdf -> markdown, page by page — the desktop app"
authors = ["roest1"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time", "sync"] }
open = "5"
getrandom = "0.3"

# the shell should cost megabytes, not tens of them
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
