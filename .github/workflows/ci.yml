name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # a second push to the same branch makes the first run's answer irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The pin is `packageManager` in package.json, the one place the Bun
      # version is written down, so CI runs the Bun the lockfile was made with
      # rather than whatever shipped this morning.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # `bun install --frozen-lockfile` rather than a plain install, so a lockfile
      # that drifted from package.json fails here instead of resolving to something
      # nobody has run locally.
      - run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      # prettier is pinned exactly in package.json, and .prettierrc.json spells
      # out every option, so this agrees with format-on-save in the editor
      # rather than with whatever the latest prettier's defaults happen to be.
      - name: format
        run: bun run format:check

      # Separate from the build step on purpose: `bun run build` runs `tsc -b`
      # first, so a type error would read as a build failure and send someone
      # looking at vite. This says which of the two broke.
      - name: typecheck
        run: bun run typecheck

      # The tests run in a real browser (tests/README.md): Playwright's own
      # Chromium, the version the lockfile's playwright expects, with the system
      # libraries it needs.
      - name: test
        run: |
          bunx playwright install --with-deps chromium
          bun run test

      - name: build
        run: bun run build
