# Build the desktop bundles on all three platforms. Honest scope: this proves
# the toolchains resolve and the bundles assemble — nobody is looking at the
# window, so macOS/Windows rendering still needs eyes on real hardware.
name: desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v5
      - name: engine tests + lint
        working-directory: engine
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run pytest -q
      - name: web typecheck + build
        working-directory: web
        run: |
          bun install
          bun run typecheck
          bun run build

  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: webview build deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v5
      - name: web deps
        working-directory: web
        run: bun install
      - name: package the engine (PyInstaller sidecar)
        working-directory: engine
        run: uv run --extra build python ../scripts/build_engine.py
      - name: tauri build
        working-directory: web
        run: bun run tauri build
        env:
          # linuxdeploy's bundled strip chokes on modern .relr.dyn sections
          NO_STRIP: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
