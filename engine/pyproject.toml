[project]
name = "mdgest"
version = "0.2.0"
description = "pdf -> reviewable markdown: a page-by-page editor, and a gate that checks the result"
requires-python = ">=3.11"
dependencies = [
    "pypdfium2>=4.30",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "httpx>=0.27", "cairosvg>=2.7"]
# packaging the engine into the desktop app's sidecar binary (>=6.16 for py3.14)
build = ["pyinstaller>=6.16"]

[project.scripts]
mdgest = "mdgest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mdgest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# B008: Body()/File()/typer.Option() in defaults is how FastAPI and typer work.
ignore = ["B008", "E501", "E741", "B905"]
