[project]
name = "mdgest"
version = "0.1.0"
description = "pdf -> reviewable markdown, with a UI and a CLI that do the same things"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mdgest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
