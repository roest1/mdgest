[project]
name = "mdgest"
version = "1.0.0"
description = "pdf -> markdown engine"
requires-python = ">=3.14" # 3.15 comes out in October
dependencies = [
    "python-multipart>=0.0.32",
    "pypdfium2>=5.13",
    "pillow>=12.3.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "typer>=0.27.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.5", "httpx>=0.28.1", "cairosvg>=2.9"]
build = ["pyinstaller>=6.22.2"]

[project.scripts]
mdgest = "mdgest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mdgest"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# see https://docs.astral.sh/ruff/rules/
# run ruff check --select <code> to see if more ruff rules are worth adding
select = [
    "E",  # pycodestyle errors (E225 missing whitespace around operators, E302 missing blank lines before function def, E711 == instead of `is`)
    "F",  # Pyflakes bugs (F401 unused imports, F821 undefined names, F841 unused local variables, F811 redefining a name before it's used)
    "I", # isort (import ordering/grouping: 1. stdlib -> 2. third-party -> 3. local, alphabetized by group)
    "B", # flake8-bugbear (bug-likely patterns that aren't syntax errors: B006 mutable default args, B023 closure over a loop variable, B012 return/break inside finally)
    "UP", # pyupgrade (flags old-style syntax when a newer equivalent exists)
    "W" # pycodestyle warnings (W291 trailing whitespace, W605 invalid escape sequence in non-raw string)
]
ignore = [
    "B008", # B008: (don't call a function in a default arg) but Body()/File()/typer.Option() in defaults is how FastAPI and typer work.
    "E501" # E501: ignore lines the formatter couldn't keep columns < `line-length`
]
